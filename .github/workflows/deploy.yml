name: Deploy Pages

# 触发条件，push到master分支或者pull request到master分支
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # 支持手动在工作流上触发
  workflow_dispatch:

# 设置时区
env:
  TZ: Asia/Shanghai

# 权限设置
permissions:
  # 允许读取仓库内容的权限。
  contents: read
  # 允许写入 GitHub Pages 的权限。
  pages: write
  # 允许写入 id-token 的权限。
  id-token: write

# 并发控制配置
concurrency:
  group: pages
  cancel-in-progress: false

# 定义执行任务
jobs:
  # 构建任务
  build:

    runs-on: ubuntu-latest

    # node v23 运行
    strategy:
      matrix:
        node-version: [23]

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保留 Git 信息
          fetch-depth: 0

      # 设置使用 Node.js 版本
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 使用 PNPM 10（v11 改了构建脚本配置，v10 稳定）
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: "10"
          run_install: false

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 构建项目
      - name: Build blog project
        run: |
          echo ${{ github.workspace }}
          pnpm build

      # 添加 .nojekyll 防止 GitHub Pages 用 Jekyll 处理（Jekyll 会忽略 .html 文件和 _ 开头的目录）
      - name: Add .nojekyll
        run: touch ./docs/.vitepress/dist/.nojekyll

      # 上传构建产物，用于后续部署
      # 注：不使用 jekyll-build-pages，VitePress 产物已是纯静态 HTML，Jekyll 会改变文件结构导致 .html 链接 404
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.vitepress/dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
